project:
  type: book
  output-dir: _book
  execute-dir: project

book:
  title: "The statmodels7 Framework"
  subtitle: "Mathematical foundations"
  author: "Giovanni Tinervia"
  date: today
  date-format: "D MMMM YYYY"
  search: true
  page-footer:
    left: "The statmodels7 Framework"
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-link-functions.qmd
    - chapters/03-distributions.qmd
    - chapters/04-transformations.qmd
  appendices:
    - chapters/A1-notation.qmd


format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-link: false
    code-copy: true
    html-math-method: mathjax
    fig-cap-location: bottom
    tbl-cap-location: top
    reference-location: margin
    citations-hover: true
    smooth-scroll: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    R.options:
      knitr.graphics.auto_pdf: false

crossref:
  thm-title: "Theorem"
  lem-title: "Lemma"
  cor-title: "Corollary"
  prp-title: "Proposition"
  def-title: "Definition"
