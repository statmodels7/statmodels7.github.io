project:
  type: book
  output-dir: _book
  execute-dir: project

book:
  title: "statmodels7"
  subtitle: "Statistical models built from reusable parts"
  author: "Giovanni Tinervia"
  date: today
  date-format: "D MMMM YYYY"
  search: true
  page-footer:
    left: "statmodels7"
  chapters:
    - index.qmd
    - part: "Using statmod()"
      chapters:
        - chapters/01-model.qmd
        - chapters/02-beyond.qmd
        - chapters/03-lm.qmd
        - chapters/04-glm.qmd
        - chapters/05-distributions.qmd
        - chapters/06-gam.qmd
        - chapters/07-lmm.qmd
        - chapters/08-glmm.qmd
        - chapters/09-gamm.qmd
    - part: "Special model terms"
      chapters:
        - chapters/10-penalized.qmd
        - chapters/11-breakpoints.qmd
        - chapters/12-nonlinear.qmd
        - chapters/13-timeseries.qmd
    - part: "Choosing"
      chapters:
        - chapters/14-choosing.qmd
    - part: "Extending the toolkit"
      chapters:
        - chapters/15-own-distributions.qmd
        - chapters/16-own-terms.qmd
    - chapters/A2-references.qmd

bibliography: references.bib
link-citations: true

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    toc: true
    toc-depth: 4
    toc-expand: true
    number-sections: true
    number-depth: 2
    code-link: false
    code-copy: true
    html-math-method: mathjax
    fig-cap-location: bottom
    tbl-cap-location: top
    reference-location: margin
    citations-hover: true
    smooth-scroll: true

execute:
  # Not `auto`: the freeze cache does not see the R files a chapter sources,
  # which is where the gates live, so a cached render would report success
  # without having checked anything.
  freeze: false
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    R.options:
      knitr.graphics.auto_pdf: false
